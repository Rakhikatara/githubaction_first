
name: Exercise 5 - Job Dependencies

on: workflow_dispatch

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: echo "Application Build Completed"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test
        run: echo "Application Testing Completed"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy
        run: echo "Application Deployment Completed"
