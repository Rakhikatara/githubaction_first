
name: Exercise 3 - Runner

on: workflow_dispatch

jobs:
  runner-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check Operating System
        run: uname -a

      - name: Check Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Check User
        run: whoami

      - name: Check Disk
        run: df -h
