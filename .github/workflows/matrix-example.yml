name: Exercise 8 - Matrix

on: workflow_dispatch

jobs:
  matrix-job:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Display Version
        run: node --version
